<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metin Simulator — LIRIN</title>
<meta name="description" content="Set your DPS and session length and see what a metin drops, what it transforms into and what it is worth.">
<meta property="og:type" content="website">
<meta property="og:title" content="Metin Simulator — LIRIN">
<meta property="og:description" content="Set your DPS and session length and see what a metin drops, what it transforms into and what it is worth.">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0f1013">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/inter-400.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="/fonts/inter-500.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="/fonts/inter-600.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="/fonts/cormorant-600.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="/common.css">
<style>
/* shared parts (.note .panel .pbody .sr .slot .btn .prow .pin .pn ...) live in /common.css; only the differences are here */
.slot{width:34px;height:34px;box-shadow:none;font-size:.7rem}
.btn{margin-top:14px}
.er{padding:6px 14px}

/* character */
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.cb{display:flex;flex-direction:column;gap:7px;min-width:0}
.cb>span{color:var(--dim);font-size:.7rem;font-weight:600;letter-spacing:.14em;text-align:center;text-transform:uppercase}
.qe{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:#1b1c22}
.qe button{flex:none;width:38px;height:42px;border:0;background:none;font-size:1.2rem;cursor:pointer}.qe button:hover{color:var(--gold)}
.qe input{flex:1;width:0;min-width:0;padding:6px;border:0;background:none;text-align:center;font-size:1.05rem;font-weight:600}

/* metin picker */
.mt{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mtile{padding:13px 15px;border:1px solid var(--line);border-radius:11px;background:linear-gradient(180deg,#1d1e24,#16171c);color:#a6a5a8;font-size:.78rem;line-height:1.6;text-align:left;cursor:pointer;transition:border-color .2s,background .2s}
.mtile b{display:block;color:#ece4d3;font-size:.9rem}
.mtile:hover{border-color:rgba(199,167,107,.45)}
.mtile.on{border-color:var(--gold);background:rgba(199,167,107,.12);box-shadow:0 0 0 1px var(--gold)}
.hint{margin:12px 0 0;color:var(--dim);font-size:.78rem}

/* result */
.stats{display:flex;flex-wrap:wrap;gap:12px 34px;margin-bottom:16px}
.stats span,.vb span{display:block;color:var(--dim);font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.stats b{color:#e6d2a7;font-size:1.1rem}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--dim);font-size:.7rem;font-weight:600;letter-spacing:.1em;text-align:right;text-transform:uppercase}
td{padding:9px 12px;text-align:right;white-space:nowrap}
td,.stats b,.vb b{font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
tbody tr:nth-child(odd){background:rgba(255,255,255,.03)}
td small{display:block;font-size:.68rem}
.nm{display:flex;align-items:center;gap:10px;font-weight:500}
.b{color:#e6d2a7;font-weight:600}
.ev{color:var(--dim)}
.tf{color:var(--green)}.tf .nm{justify-content:flex-end}
.t-g{color:var(--dim)}.t-c{color:var(--green)}.t-r{color:#6fb1ff}.t-e{color:#b57cff}.t-l{color:#e0a64a}.t-m{color:#ff6b6b}
.vals{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.vb{padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:#1b1c22}
.vb b{color:#e6d2a7;font-size:1.3rem}.vb.g b{color:var(--green)}
.vb small{display:block;margin-top:4px;color:var(--dim);font-size:.72rem}

/* prices: see common.css */
.prow:first-child{margin-top:0}
.summary .who b{color:var(--gold);font-family:var(--serif);font-size:1.1rem}

@media(max-width:700px){.vals{grid-template-columns:1fr}.summary{max-height:38svh;overflow-y:auto;overscroll-behavior:contain}}
</style>
</head>
<body>
<div class="app-root">
  <nav id="sidebar"></nav>
  <script src="/app.js"></script>
  <main class="main">
    <div class="inner">
      <h1>METIN SIMULATOR</h1><div class="line"></div>
      <p class="note">Every drop is rolled at random, so each run is a little different. All four metins are available.</p>
      <section class="panel"><h2>Your Character</h2><div class="pbody">
        <div class="chars">
          <div class="cb"><div class="qe"><button data-k="dps" data-s="-1" aria-label="Less">−</button><input data-k="dps" inputmode="text" maxlength="9" aria-label="Average DPS (accepts 90k)"><button data-k="dps" data-s="1" aria-label="More">+</button></div><span>Average DPS</span></div>
          <div class="cb"><div class="qe"><button data-k="min" data-s="-1" aria-label="Less">−</button><input data-k="min" inputmode="numeric" maxlength="4" aria-label="Session in minutes"><button data-k="min" data-s="1" aria-label="More">+</button></div><span>Session (min)</span></div>
          <div class="cb"><div class="qe"><button data-k="trv" data-s="-1" aria-label="Less">−</button><input data-k="trv" inputmode="numeric" maxlength="3" aria-label="Travel time in seconds"><button data-k="trv" data-s="1" aria-label="More">+</button></div><span>Travel time (sec)</span></div>
        </div>
        <div class="btns"><button class="btn" data-a="roll">Roll again</button></div>
      </div></section>
      <section class="panel"><h2>Pick a Metin</h2><div class="pbody"><div class="mt" id="pick"></div>
        <p class="hint">Pick up to two metins and each gets its own result.</p></div></section>
      <div id="sims"></div>
      <section class="panel"><h2>Material Prices</h2><div class="pbody"><div id="prices"></div><button class="btn" data-a="reset">Reset prices</button></div></section>
    </div>
    <div class="summary" id="sum"></div>
    <div class="sr" id="live" aria-live="polite"></div>
  </main>
</div>
<script>
/* ===== data: add a metin by copying the Murder block (drop = [name, chance %, min, max, tier, extra]) ===== */
const METINS=[
  {id:'murder',name:'Lv. 70 Metin of Murder',hp:296550,drops:[
    ['Torn Page',100,1,2,'g'],
    ['Yang Coupon 40000',100,1,2,'g',{yang:40000}],            // each coupon = 40.000 Yang
    ['Amethyst Fragment',100,1,1,'g',{to:'Amethyst Crystal'}],  // FRAG fragments = 1 crystal
    ['Glimmer Dust',50,1,2,'c'],
    ['Enchant Item',50,1,1,'c'],
    ['Murder Fragment',25,1,1,'r',{to:'Murder Rock'}],
    ['Blessing Scroll',8,1,1,'l'],
    ['Stone Shard',4,1,2,'m'],
    ['Soul Stone',4,1,1,'m']]},
  {id:'jeon',name:'Lv. 90 Metin Jeon-Un',hp:905000,drops:[
    ['Yang Coupon 40000',100,3,5,'g',{yang:40000}],
    ['Enchant Item',100,2,2,'g'],
    ['Ruby Fragment',100,1,1,'g',{to:'Ruby Crystal'}],
    ['Torn Page',50,1,2,'c'],
    ['Glimmer Dust',50,1,2,'c'],
    ['Forest Fragment',25,1,1,'r',{to:'Forest Rock'}],
    ['Blessing Scroll',8,1,1,'l'],
    ['Stone Shard',4,1,2,'m'],
    ['Soul Stone',4,1,1,'m']]},
  {id:'manti',name:'Lv. 105 Manticore Metin',hp:1800000,drops:[
    ['Enchant Item',100,3,4,'g'],
    ['Yang Coupon 100000',100,2,4,'g',{yang:100000}],
    ['Onyx Fragment',100,1,1,'g',{to:'Onyx Crystal'}],
    ['Glimmer Dust',25,1,1,'r'],
    ['Fragment of Dark Continent',15,1,1,'e',{to:"Dark Continent's Rock"}],
    ['Cor Draconis',15,1,1,'e'],
    ['Blessing Scroll',8,1,1,'l']]},
  {id:'forest',name:'Lv. 110 Metin of the Forests',hp:4000000,drops:[
    ['Enchant Item',100,4,6,'g'],
    ['Yang Coupon 100000',100,4,6,'g',{yang:100000}],
    ['Garnet Fragment',100,1,1,'g',{to:'Garnet Crystal'}],
    ['Cor Draconis',25,1,1,'r'],
    ['Glimmer Dust',25,1,1,'r'],
    ['Enchant Item+',15,1,1,'e'],
    ['Fragment of the Trees',15,1,1,'e',{to:'Rock of the Trees'}],
    ['Shard of the Forest',15,1,1,'e']]}
];
const TIER={g:'Guaranteed',c:'Common',r:'Rare',e:'Epic',l:'Legendary',m:'Mystic'};
const FRAG=10;
const LIM={dps:[1,9999999],min:[1,1440],trv:[0,600]},STEP={dps:1000,min:10,trv:1};
const Z=1.2816;                                     // z-score for P10 / P90

/* ===== helpers ($, ini, okNum, slot, money helpers, persist ... come from /app.js) ===== */
const BY=Object.fromEntries(METINS.map(m=>[m.id,m]));
const tfmt=s=>{const r=Math.round(s*10)/10;if(r<60)return r.toFixed(1)+'s';const t=Math.round(s);return Math.floor(t/60)+'m '+t%60+'s'};
const clamp=(k,v)=>Math.min(LIM[k][1],Math.max(LIM[k][0],Math.round(v)||0));

/* ===== seeded random: same seed => same luck, so changing DPS/session moves results smoothly ===== */
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0};
const newSeed=()=>(Math.random()*4294967296)>>>0;
const gauss=R=>{const u=1-R(),v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
function binom(n,p,R){                               // number of metins that dropped the item
  if(p>=1)return n;if(p<=0||n<=0)return 0;
  if(n<=200){let c=0;for(let i=0;i<n;i++)if(R()<p)c++;return c}
  return Math.min(n,Math.max(0,Math.round(n*p+Math.sqrt(n*p*(1-p))*gauss(R))));   // normal approximation
}
function sumUniform(c,lo,hi,R){                      // sum of c integers uniform in [lo,hi]
  if(lo===hi||c===0)return c*lo;
  if(c<=200){let s=0;for(let i=0;i<c;i++)s+=lo+Math.floor(R()*(hi-lo+1));return s}
  const w=hi-lo+1;
  return Math.max(c*lo,Math.min(c*hi,Math.round(c*(lo+hi)/2+Math.sqrt(c*(w*w-1)/12)*gauss(R))));
}

/* ===== state (saved in the browser) ===== */
const KEY='lirinMetinV1';
let S={dps:90000,min:150,trv:0,sel:['murder'],price:{}},RUN={},NAMES=[],SEED=newSeed();
function apply(r){
  if(!r||typeof r!=='object')return;
  for(const k in LIM)if(r[k]!=null&&r[k]!==''&&Number.isFinite(+r[k]))S[k]=clamp(k,+r[k]);
  if(Array.isArray(r.sel)){const s=[...new Set(r.sel)].filter(id=>BY[id]).slice(0,2);if(s.length)S.sel=s}
  if(r.price&&typeof r.price==='object'){S.price={};for(const n in r.price)if(okNum(r.price[n]))S.price[n]=r.price[n]}
}
try{apply(JSON.parse(localStorage.getItem(KEY)))}catch(e){}
const{save}=persist(KEY,()=>S);

/* ===== simulation ===== */
function roll(m){
  const n=Math.floor(S.min*60/(m.hp/S.dps+S.trv)),cnt={};
  m.drops.forEach(([d,ch,lo,hi],j)=>{const R=rng(SEED^hash(m.id+j));cnt[d]=sumUniform(binom(n,ch/100,R),lo,hi,R)});
  return{n,cnt};
}
function derive(m,r){                              // items you can sell + Yang from coupons
  const items={};let yang=0;
  for(const[d,,,,,x]of m.drops){const c=r.cnt[d];
    if(x&&x.yang)yang+=c*x.yang;else if(x&&x.to)items[x.to]=(items[x.to]||0)+Math.floor(c/FRAG);else items[d]=(items[d]||0)+c}
  return{items,yang};
}
/* fragments that do not make a whole crystal are lost: how many fragments are expected to be left over after `kills` metins
   (X mod FRAG). Exact when the number of fragments is certain or small, otherwise the leftover is spread evenly (FRAG-1)/2 */
function leftover(kills,p,lo,hi){
  if(p>=1&&lo===hi)return(kills*lo)%FRAG;
  const sd=Math.sqrt(kills*p*(1-p));
  if(lo===1&&hi===1&&sd<6&&kills<=1000){          // few drops: add up the exact binomial chances
    let q=Math.pow(1-p,kills),t=0;
    for(let k=0;k<=kills;k++){t+=q*(k%FRAG);q*=(kills-k)/(k+1)*p/(1-p)}
    return t;
  }
  return(FRAG-1)/2;
}
/* expected Yang value (and std-dev) for `kills` metins; fragments count only as whole crystals */
function expect(m,kills){
  let mean=0,v=0;
  for(const[d,ch,lo,hi,,x]of m.drops){
    const p=ch/100,w=hi-lo+1,e=(lo+hi)/2,tot=kills*p*e;
    let u;
    if(x&&x.yang){u=x.yang;mean+=tot*u}
    else if(x&&x.to){const pc=S.price[x.to]||0;u=pc/FRAG;mean+=pc*Math.max(0,tot-leftover(kills,p,lo,hi))/FRAG}
    else{u=S.price[d]||0;mean+=tot*u}
    v+=kills*(p*((w*w-1)/12+e*e)-p*p*e*e)*u*u}
  return{mean,sd:Math.sqrt(v)};
}
const metins=()=>S.sel.map(id=>BY[id]);
const rollAll=()=>{RUN={};metins().forEach(m=>RUN[m.id]=roll(m))};

/* ===== drawing ===== */
function drawInputs(){document.querySelectorAll('input[data-k]').forEach(i=>{if(document.activeElement!==i)i.value=S[i.dataset.k]})}
function drawPick(){
  $('pick').innerHTML=METINS.map(m=>{
    const body=`<b>${m.name}</b>Health: ${full(m.hp)}<br>Time to destroy: ${tfmt(m.hp/S.dps)}`;
    return`<button class="mtile${S.sel.includes(m.id)?' on':''}" data-id="${m.id}" aria-pressed="${S.sel.includes(m.id)}">${body}</button>`;
  }).join('');
}
function drawSims(){
  $('sims').innerHTML=metins().map(m=>{
    const r=RUN[m.id],rows=m.drops.map(([d,ch,lo,hi,t,x])=>{
      const c=r.cnt[d],ex=r.n*ch/100*(lo+hi)/2;let tf='<span class="t-g">–</span>';
      if(x&&x.yang)tf=`${fmt(c*x.yang)} Yang`;
      else if(x&&x.to){const l=c%FRAG;tf=`<span class="nm">${slot(x.to)}${full(Math.floor(c/FRAG))}× ${x.to}</span>${l?`<small>+${l} left over</small>`:''}`}
      return`<tr><td><span class="nm">${slot(d)}${d}</span></td><td>${ch}% (${lo}-${hi})<small class="t-${t}">${TIER[t]}</small></td><td class="b">${full(c)}</td><td class="ev">${ex.toFixed(1)}</td><td>${(c*60/S.min).toFixed(2)}</td><td class="tf">${tf}</td></tr>`}).join('');
    return`<section class="panel"><h2>${m.name}</h2><div class="pbody">
      <div class="stats"><div><span>Health</span><b>${full(m.hp)}</b></div><div><span>Time to destroy</span><b>${tfmt(m.hp/S.dps)}</b></div><div><span>Travel time</span><b>${S.trv}s</b></div><div><span>Destroyed metins</span><b>${full(r.n)}</b></div></div>
      <div class="tw"><table><thead><tr><th>Item</th><th>Chance</th><th>This run</th><th>Expected</th><th>Per hour</th><th>Transform</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="vals"><div class="vb"><span>Materials value</span><b id="mv-${m.id}"></b></div><div class="vb g"><span>Total gain (materials + Yang)</span><b id="tg-${m.id}"></b><small id="ev-${m.id}"></small></div></div>
    </div></section>`}).join('');
}
function drawPrices(){
  NAMES=[...new Set(metins().flatMap(m=>m.drops.map(([d,,,,,x])=>x&&x.yang?null:(x&&x.to)||d).filter(Boolean)))];
  const ms=metins(),tag=m=>ms.length>1?m.name.match(/Lv\. \d+/)[0]+' · ':'';
  $('prices').innerHTML=NAMES.map((n,i)=>`<div class="prow"><div class="pin"><label><input data-pr="${i}" inputmode="text" placeholder="Write the Unit Price" value="${S.price[n]?fmt(S.price[n],6):''}" aria-label="Unit price of ${n}"><em>Yang</em></label><div class="er" hidden>Format: 1450, 1.45k, 2.3kk</div><div class="pn">${slot(n)}<span>${n}</span></div></div>
    <div class="pv"><div class="u">Unit : <span id="u${i}"></span></div>${ms.map((m,k)=>`<div class="t">${tag(m)}<span id="q${k}_${i}"></span>× = <span id="t${k}_${i}"></span></div>`).join('')}</div></div>`).join('');
}
function paint(){
  let sum='',cMat=0,cTot=0;
  metins().forEach((m,k)=>{
    const r=RUN[m.id],d=derive(m,r);let mat=0;
    for(const n in d.items)mat+=d.items[n]*(S.price[n]||0);
    const e=expect(m,r.n);
    cMat+=mat;cTot+=mat+d.yang;
    $('mv-'+m.id).textContent=money(mat);$('tg-'+m.id).textContent=money(mat+d.yang);
    $('ev-'+m.id).textContent=`Expected ${fmt(e.mean)} · P10–P90: ${fmt(Math.max(0,e.mean-Z*e.sd))} – ${fmt(e.mean+Z*e.sd)}`;
    sum+=`<div class="who"><b>${m.name}</b></div><div><span>Destroyed :</span><b>${full(r.n)}</b></div><div><span>Materials :</span><b>${money(mat)}</b></div><div class="tot"><span>Total gain :</span><b>${money(mat+d.yang)}</b></div>`;
    NAMES.forEach((n,i)=>{const q=d.items[n]||0,p=S.price[n]||0;$(`q${k}_${i}`).textContent=full(q);$(`t${k}_${i}`).textContent=fmt(q*p)});
  });
  if(S.sel.length>1)sum+=`<div class="who"><b>Combined</b></div><div><span>Materials :</span><b>${money(cMat)}</b></div><div class="tot"><span>Total gain :</span><b>${money(cTot)}</b></div>`;
  NAMES.forEach((n,i)=>$('u'+i).textContent=fmt(S.price[n]||0));
  $('sum').innerHTML=sum;
}
const refresh=()=>{rollAll();drawPick();drawSims();paint()};
const refreshD=deb(refresh,100);

/* ===== events ===== */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.k){const k=b.dataset.k;S[k]=clamp(k,S[k]+(+b.dataset.s)*STEP[k]);drawInputs();refresh();save()}
  else if(b.dataset.a==='roll'){SEED=newSeed();refresh();
    $('live').textContent='New roll. '+metins().map(m=>m.name+': '+money(derive(m,RUN[m.id]).yang)+' Yang from coupons').join('. ')}
  else if(b.dataset.a==='reset'){NAMES.forEach(n=>delete S.price[n]);drawPrices();paint();save()}   // only the prices shown now (the selected metin or both metins)
  else if(b.dataset.id){
    const id=b.dataset.id,i=S.sel.indexOf(id);
    if(i>=0){if(S.sel.length>1)S.sel.splice(i,1)}else{S.sel.push(id);if(S.sel.length>2)S.sel.shift()}
    drawPrices();refresh();save();
  }
});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset.k;
  if(k){const v=parseMoney(t.value);if(v===null)return;S[k]=clamp(k,v||LIM[k][0]);refreshD();save();return}   // typed DPS / session / travel (accepts 90k)
  if(t.dataset.pr===undefined)return;                                                                          // unit price: 1450, 1.45k, 2.3kk ...
  const v=t.value.trim()?parseMoney(t.value):0;
  flagBad(t,v===null);
  if(v===null)return;
  S.price[NAMES[+t.dataset.pr]]=v;save();paint();
});
document.addEventListener('change',e=>{if(e.target.dataset.k)drawInputs()});
drawInputs();drawPrices();refresh();
/* load every drop picture in the background, so switching metins never shows initials first */
setTimeout(()=>new Set(METINS.flatMap(m=>m.drops.flatMap(([d,,,,,x])=>x&&x.to?[d,x.to]:[d]))).forEach(warm),300);
</script>
</body>
</html>
